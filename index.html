<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পূজার - কালেকশন / জমা / খরচ / উদ্বৃত্ত</title>
    <style>
        :root {
            --primary-color: #d32f2f;
            --secondary-color: #1976d2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 20px;
            color: var(--primary-color);
        }

        .auth-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-login {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .user-info-text {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .card-amount-box {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
        }

        .card-amount-box span {
            font-size: 16px;
            font-weight: bold;
        }

        .amount-val {
            border: 1px solid var(--border-color);
            padding: 5px 15px;
            border-radius: 4px;
            background-color: #fafafa;
            min-width: 100px;
            display: inline-block;
        }

        /* Modal / Popup Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background-color: white;
            border-radius: 8px;
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }

        /* Form Controls */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .btn-save {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Table Styles */
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table th, table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
        }

        table th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        .btn-edit {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <h1>পূজার - কালেকশন / জমা / খরচ / উদ্বৃত্ত</h1>
        <div class="auth-status">
            <span id="user-display" class="user-info-text">স্ট্যাটাস: গেস্ট ইউজার</span>
            <button id="auth-btn" class="btn-login" onclick="openLoginModal()">Login</button>
        </div>
    </header>

    <!-- Dashboard 6 Module Cards -->
    <div class="dashboard-grid">
        <!-- Card 1 -->
        <div class="card" onclick="openModule(1)">
            <h3>কমিটি কালেকশন</h3>
            <div class="card-amount-box">
                <span>টাকা</span>
                <span class="amount-val" id="dash-val-1">0.00</span>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card" onclick="openModule(2)">
            <h3>কমিটি জমা/ফেরত</h3>
            <div class="card-amount-box">
                <span>টাকা</span>
                <span class="amount-val" id="dash-val-2">0.00</span>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="card" onclick="openModule(3)">
            <h3>খরচ</h3>
            <div class="card-amount-box">
                <span>টাকা</span>
                <span class="amount-val" id="dash-val-3">0.00</span>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="card" onclick="openModule(4)">
            <h3>উদ্বৃত্ত</h3>
            <div class="card-amount-box">
                <span>টাকা</span>
                <span class="amount-val" id="dash-val-4">0.00</span>
            </div>
        </div>

        <!-- Card 5 -->
        <div class="card" onclick="openModule(5)">
            <h3>গ্রাম কালেকশন</h3>
            <div class="card-amount-box">
                <span>টাকা</span>
                <span class="amount-val" id="dash-val-5">0.00</span>
            </div>
        </div>

        <!-- Card 6 -->
        <div class="card" onclick="openModule(6)">
            <h3>ইউজার</h3>
            <div class="card-amount-box">
                <span>জন</span>
                <span class="amount-val" id="dash-val-6">0</span>
            </div>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="login-modal">
    <div class="modal-box" style="max-width: 400px;">
        <div class="modal-header">
            <h3>লগইন করুন</h3>
            <button class="close-btn" onclick="closeModal('login-modal')">&times;</button>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group" style="margin-bottom: 12px;">
                <label>ইউজার আইডি</label>
                <input type="text" id="login-id" required placeholder="ইউজার আইডি লিখুন">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>পাসওয়ার্ড</label>
                <input type="password" id="login-pass" required placeholder="পাসওয়ার্ড লিখুন">
            </div>
            <button type="submit" class="btn-save" style="width: 100%;">লগইন</button>
        </form>
    </div>
</div>

<!-- Main Module Modal -->
<div class="modal-overlay" id="module-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modal-title">মডিউল নাম</h3>
            <button class="close-btn" onclick="closeModal('module-modal')">&times;</button>
        </div>

        <!-- Form Section -->
        <div id="form-container">
            <!-- Dynamic Form Fields will load here -->
        </div>

        <!-- List/Table Section -->
        <div id="table-container" class="table-responsive">
            <!-- Dynamic Tables will load here -->
        </div>
    </div>
</div>

<script>
    // Google Apps Script Backend Integration URL
    const APPS_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    // Global State Management
    let currentUser = null; // null = Guest, { id: 'admin', role: 'admin' }, etc.
    let activeModuleId = null;

    // Default Demo Users Data
    let usersList = [
        { id: 1, date: '2026-08-24 10:00', name: 'অ্যাডমিন', village: 'কেন্দ্রীয়', mobile: '01700000000', userId: 'admin', pass: '1234', role: 'admin' },
        { id: 2, date: '2026-08-24 10:05', name: 'রাহুল হালদার', village: 'উত্তর পাড়া', mobile: '01800000000', userId: 'user1', pass: '1234', role: 'user' }
    ];

    // Data Store for Modules
    let database = {
        module1: [], // কমিটি কালেকশন
        module2: [], // কমিটি জমা/ফেরত
        module3: [], // খরচ
        module5: []  // গ্রাম কালেকশন
    };

    const VILLAGES = ["উত্তর পাড়া", "দক্ষিণ পাড়া", "পূর্ব পাড়া", "পশ্চিম পাড়া", "কেন্দ্রীয় এলাকা"];
    const HOUSES = ["বিশ্বাস বাড়ি", "মন্ডল বাড়ি", "ঘোষ বাড়ি", "সরকার বাড়ি", "হালদার বাড়ি"];

    window.onload = function() {
        calculateTotals();
    };

    function openLoginModal() {
        if(currentUser) {
            // Logout
            currentUser = null;
            document.getElementById('user-display').innerText = "স্ট্যাটাস: গেস্ট ইউজার";
            document.getElementById('auth-btn').innerText = "Login";
            alert("আপনি লগআউট করেছেন।");
            return;
        }
        document.getElementById('login-modal').classList.add('active');
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    function handleLogin(e) {
        e.preventDefault();
        const idInput = document.getElementById('login-id').value.trim();
        const passInput = document.getElementById('login-pass').value.trim();

        const foundUser = usersList.find(u => u.userId === idInput && u.pass === passInput);

        if(foundUser) {
            currentUser = foundUser;
            document.getElementById('user-display').innerText = `ইউজার: ${currentUser.name} (${currentUser.role === 'admin' ? 'এডমিন' : 'সাধারণ ইউজার'})`;
            document.getElementById('auth-btn').innerText = "Logout";
            closeModal('login-modal');
            document.getElementById('login-id').value = '';
            document.getElementById('login-pass').value = '';
        } else {
            alert("ইউজার আইডি অথবা পাসওয়ার্ড ভুল হয়েছে!");
        }
    }

    function openModule(moduleId) {
        // Guest Access Guard
        if (!currentUser) {
            alert("গেস্ট ইউজাররা কোনো মডিউলে প্রবেশ করতে পারবেন না। অনুগ্রহ করে ইউজার আইডি ও পাসওয়ার্ড দিয়ে লগইন করুন।");
            openLoginModal();
            return;
        }

        // Regular User Guard for User Module (Module 6)
        if (moduleId === 6 && currentUser.role !== 'admin') {
            alert("সাধারণ ইউজাররা 'ইউজার মডিউল' এক্সেস করতে পারবেন না!");
            return;
        }

        activeModuleId = moduleId;
        const modalTitle = document.getElementById('modal-title');
        const formContainer = document.getElementById('form-container');
        
        document.getElementById('module-modal').classList.add('active');

        switch(moduleId) {
            case 1:
                modalTitle.innerText = "কমিটি কালেকশন";
                renderFormModule1();
                renderTableModule1();
                break;
            case 2:
                modalTitle.innerText = "কমিটি জমা / ফেরত";
                renderFormModule2();
                renderTableModule2();
                break;
            case 3:
                modalTitle.innerText = "খরচ মডিউল";
                renderFormModule3();
                renderTableModule3();
                break;
            case 4:
                modalTitle.innerText = "উদ্বৃত্ত বিবরণী";
                formContainer.innerHTML = ""; // No input form for Surplus
                renderTableModule4();
                break;
            case 5:
                modalTitle.innerText = "গ্রাম কালেকশন";
                renderFormModule5();
                renderTableModule5();
                break;
            case 6:
                modalTitle.innerText = "ইউজার মডিউল";
                renderFormModule6();
                renderTableModule6();
                break;
        }
    }

    // --- Module 1: কমিটি কালেকশন ---
    function renderFormModule1() {
        let vOptions = VILLAGES.map(v => `<option value="${v}">${v}</option>`).join('');
        let hOptions = HOUSES.map(h => `<option value="${h}">${h}</option>`).join('');
        document.getElementById('form-container').innerHTML = `
            <form onsubmit="saveModule1(event)">
                <div class="form-grid">
                    <div class="form-group"><label>নাম</label><input type="text" id="m1-name" required></div>
                    <div class="form-group"><label>গ্রাম</label><select id="m1-village" required><option value="">--নির্বাচন করুন--</option>${vOptions}</select></div>
                    <div class="form-group"><label>বাড়ি</label><select id="m1-house" required><option value="">--নির্বাচন করুন--</option>${hOptions}</select></div>
                    <div class="form-group"><label>পরিমাণ (৳)</label><input type="number" id="m1-amount" required step="any"></div>
                </div>
                <button type="submit" class="btn-save">Save</button>
            </form>
        `;
    }

    function saveModule1(e) {
        e.preventDefault();
        const entry = {
            id: Date.now(),
            dateTime: new Date().toLocaleString('bn-BD'),
            name: document.getElementById('m1-name').value,
            village: document.getElementById('m1-village').value,
            house: document.getElementById('m1-house').value,
            amount: parseFloat(document.getElementById('m1-amount').value),
            userId: currentUser.userId
        };
        database.module1.push(entry);
        calculateTotals();
        renderTableModule1();
        e.target.reset();
    }

    function renderTableModule1() {
        let isAdmin = currentUser.role === 'admin';
        let rows = database.module1.map((item, idx) => `
            <tr>
                <td>${item.dateTime}</td>
                <td>${item.name}</td>
                <td>${item.village}</td>
                <td>${item.house}</td>
                <td>${item.amount.toFixed(2)}</td>
                <td>${item.userId}</td>
                ${isAdmin ? `<td>
                    <button class="btn-edit" onclick="editModule1(${idx})">এডিট</button>
                    <button class="btn-delete" onclick="deleteModule1(${idx})">মুছুন</button>
                </td>` : ''}
            </tr>
        `).join('');

        document.getElementById('table-container').innerHTML = `
            <h3>কালেকশন লিস্ট</h3>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ/সময়</th><th>নাম</th><th>গ্রাম</th><th>বাড়ি</th><th>পরিমাণ</th><th>ইউজার আইডি</th>
                        ${isAdmin ? '<th>Action</th>' : ''}
                    </tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="7">কোনো ডাটা নেই</td></tr>'}</tbody>
            </table>
        `;
    }

    function editModule1(idx) {
        let newAmt = prompt("নতুন পরিমাণ লিখুন:", database.module1[idx].amount);
        if(newAmt !== null && !isNaN(parseFloat(newAmt))) {
            database.module1[idx].amount = parseFloat(newAmt);
            calculateTotals();
            renderTableModule1();
        }
    }

    function deleteModule1(idx) {
        if(confirm("আপনি কি এটি মুছে ফেলতে চান?")) {
            database.module1.splice(idx, 1);
            calculateTotals();
            renderTableModule1();
        }
    }

    // --- Module 2: কমিটি জমা / ফেরত ---
    function renderFormModule2() {
        document.getElementById('form-container').innerHTML = `
            <form onsubmit="saveModule2(event)">
                <div class="form-grid">
                    <div class="form-group"><label>জমা/ফেরতকারীর নাম</label><input type="text" id="m2-name" required></div>
                    <div class="form-group"><label>জমা/ফেরতকারীর গ্রাম</label><input type="text" id="m2-village" required></div>
                    <div class="form-group">
                        <label>টাইপ</label>
                        <select id="m2-type" required>
                            <option value="জমা">জমা</option>
                            <option value="ফেরত">ফেরত</option>
                        </select>
                    </div>
                    <div class="form-group"><label>পরিমাণ (৳)</label><input type="number" id="m2-amount" required step="any"></div>
                </div>
                <button type="submit" class="btn-save">Save</button>
            </form>
        `;
    }

    function saveModule2(e) {
        e.preventDefault();
        const entry = {
            id: Date.now(),
            dateTime: new Date().toLocaleString('bn-BD'),
            name: document.getElementById('m2-name').value,
            village: document.getElementById('m2-village').value,
            type: document.getElementById('m2-type').value,
            amount: parseFloat(document.getElementById('m2-amount').value),
            userId: currentUser.userId
        };
        database.module2.push(entry);
        calculateTotals();
        renderTableModule2();
        e.target.reset();
    }

    function renderTableModule2() {
        let isAdmin = currentUser.role === 'admin';
        let rows = database.module2.map((item, idx) => `
            <tr>
                <td>${item.dateTime}</td>
                <td>${item.name}</td>
                <td>${item.village}</td>
                <td>${item.type}</td>
                <td>${item.amount.toFixed(2)}</td>
                <td>${item.userId}</td>
                ${isAdmin ? `<td><button class="btn-delete" onclick="deleteModule2(${idx})">মুছুন</button></td>` : ''}
            </tr>
        `).join('');

        document.getElementById('table-container').innerHTML = `
            <h3>জমা / ফেরত লিস্ট</h3>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ/সময়</th><th>আমানতকারীর নাম</th><th>গ্রাম</th><th>জমা/ফেরত</th><th>পরিমাণ</th><th>ইউজার আইডি</th>
                        ${isAdmin ? '<th>Action</th>' : ''}
                    </tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="7">কোনো ডাটা নেই</td></tr>'}</tbody>
            </table>
        `;
    }

    function deleteModule2(idx) {
        if(confirm("আপনি কি নিশ্চিত মুছবেন?")) {
            database.module2.splice(idx, 1);
            calculateTotals();
            renderTableModule2();
        }
    }

    // --- Module 3: খরচ ---
    function renderFormModule3() {
        document.getElementById('form-container').innerHTML = `
            <form onsubmit="saveModule3(event)">
                <div class="form-grid">
                    <div class="form-group"><label>খরচের খাত</label><input type="text" id="m3-title" required></div>
                    <div class="form-group"><label>পরিমাণ (৳)</label><input type="number" id="m3-amount" required step="any"></div>
                    <div class="form-group"><label>টাকা নেওয়া ব্যক্তির নাম</label><input type="text" id="m3-person" required></div>
                    <div class="form-group"><label>নোট / মোবাইল</label><input type="text" id="m3-note"></div>
                </div>
                <button type="submit" class="btn-save">Save</button>
            </form>
        `;
    }

    function saveModule3(e) {
        e.preventDefault();
        const entry = {
            id: Date.now(),
            dateTime: new Date().toLocaleString('bn-BD'),
            title: document.getElementById('m3-title').value,
            amount: parseFloat(document.getElementById('m3-amount').value),
            person: document.getElementById('m3-person').value,
            note: document.getElementById('m3-note').value,
            userId: currentUser.userId
        };
        database.module3.push(entry);
        calculateTotals();
        renderTableModule3();
        e.target.reset();
    }

    function renderTableModule3() {
        let isAdmin = currentUser.role === 'admin';
        let rows = database.module3.map((item, idx) => `
            <tr>
                <td>${item.dateTime}</td>
                <td>${item.title}</td>
                <td>${item.amount.toFixed(2)}</td>
                <td>${item.person}</td>
                <td>${item.note || '-'}</td>
                <td>${item.userId}</td>
                ${isAdmin ? `<td><button class="btn-delete" onclick="deleteModule3(${idx})">মুছুন</button></td>` : ''}
            </tr>
        `).join('');

        document.getElementById('table-container').innerHTML = `
            <h3>খরচের লিস্ট</h3>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ/সময়</th><th>খরচের খাত</th><th>পরিমাণ</th><th>টাকা নেওয়া ব্যক্তির নাম</th><th>নোট/মোবাইল</th><th>ইউজার আইডি</th>
                        ${isAdmin ? '<th>Action</th>' : ''}
                    </tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="7">কোনো ডাটা নেই</td></tr>'}</tbody>
            </table>
        `;
    }

    function deleteModule3(idx) {
        if(confirm("মুছে ফেলতে চান?")) {
            database.module3.splice(idx, 1);
            calculateTotals();
            renderTableModule3();
        }
    }

    // --- Module 4: উদ্বৃত্ত (Surplus Summary Statement) ---
    function renderTableModule4() {
        let totals = getCalculatedTotals();
        document.getElementById('table-container').innerHTML = `
            <h3>উদ্বৃত্ত বিবরণী হিসাব</h3>
            <table>
                <thead>
                    <tr><th>আইটেম / খাত</th><th>মোট টাকা (৳)</th></tr>
                </thead>
                <tbody>
                    <tr><td style="text-align:left;">(+) মোট কালেকশন</td><td>${totals.totCol.toFixed(2)}</td></tr>
                    <tr><td style="text-align:left;">(+) মোট গ্রাম কালেকশন</td><td>${totals.totVilCol.toFixed(2)}</td></tr>
                    <tr><td style="text-align:left;">(+/-) নিট জমা ফেরত</td><td>${totals.netDeposit.toFixed(2)}</td></tr>
                    <tr><td style="text-align:left;">(-) মোট খরচ</td><td>${totals.totExp.toFixed(2)}</td></tr>
                    <tr style="font-weight:bold; background-color:#e8f5e9;">
                        <td style="text-align:left;">(=) সর্বমোট উদ্বৃত্ত টাকা</td>
                        <td>${totals.surplus.toFixed(2)}</td>
                    </tr>
                </tbody>
            </table>
        `;
    }

    // --- Module 5: গ্রাম কালেকশন ---
    function renderFormModule5() {
        let vOptions = VILLAGES.map(v => `<option value="${v}">${v}</option>`).join('');
        document.getElementById('form-container').innerHTML = `
            <form onsubmit="saveModule5(event)">
                <div class="form-grid">
                    <div class="form-group"><label>নাম</label><input type="text" id="m5-name" required></div>
                    <div class="form-group"><label>গ্রাম</label><select id="m5-village" required><option value="">--নির্বাচন করুন--</option>${vOptions}</select></div>
                    <div class="form-group"><label>পরিমাণ (৳)</label><input type="number" id="m5-amount" required step="any"></div>
                    <div class="form-group"><label>নোট</label><input type="text" id="m5-note"></div>
                </div>
                <button type="submit" class="btn-save">Save</button>
            </form>
        `;
    }

    function saveModule5(e) {
        e.preventDefault();
        const entry = {
            id: Date.now(),
            dateTime: new Date().toLocaleString('bn-BD'),
            name: document.getElementById('m5-name').value,
            village: document.getElementById('m5-village').value,
            amount: parseFloat(document.getElementById('m5-amount').value),
            note: document.getElementById('m5-note').value,
            userId: currentUser.userId
        };
        database.module5.push(entry);
        calculateTotals();
        renderTableModule5();
        e.target.reset();
    }

    function renderTableModule5() {
        let isAdmin = currentUser.role === 'admin';
        let rows = database.module5.map((item, idx) => `
            <tr>
                <td>${item.dateTime}</td>
                <td>${item.name}</td>
                <td>${item.village}</td>
                <td>${item.amount.toFixed(2)}</td>
                <td>${item.note || '-'}</td>
                <td>${item.userId}</td>
                ${isAdmin ? `<td><button class="btn-delete" onclick="deleteModule5(${idx})">মুছুন</button></td>` : ''}
            </tr>
        `).join('');

        document.getElementById('table-container').innerHTML = `
            <h3>গ্রাম কালেকশন লিস্ট</h3>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ/সময়</th><th>নাম</th><th>গ্রাম</th><th>পরিমাণ</th><th>নোট</th><th>ইউজার আইডি</th>
                        ${isAdmin ? '<th>Action</th>' : ''}
                    </tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="7">কোনো ডাটা নেই</td></tr>'}</tbody>
            </table>
        `;
    }

    function deleteModule5(idx) {
        if(confirm("মুছে ফেলতে চান?")) {
            database.module5.splice(idx, 1);
            calculateTotals();
            renderTableModule5();
        }
    }

    // --- Module 6: ইউজার ---
    function renderFormModule6() {
        document.getElementById('form-container').innerHTML = `
            <form onsubmit="saveUser(event)">
                <div class="form-grid">
                    <div class="form-group"><label>নাম</label><input type="text" id="u-name" required></div>
                    <div class="form-group"><label>গ্রাম</label><input type="text" id="u-village" required></div>
                    <div class="form-group"><label>মোবাইল</label><input type="text" id="u-mobile" required></div>
                    <div class="form-group"><label>ইউজার আইডি</label><input type="text" id="u-id" required></div>
                    <div class="form-group"><label>পাসওয়ার্ড</label><input type="text" id="u-pass" required></div>
                    <div class="form-group">
                        <label>রোল</label>
                        <select id="u-role" required>
                            <option value="user">সাধারণ ইউজার</option>
                            <option value="admin">এডমিন</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-save">Save</button>
            </form>
        `;
    }

    function saveUser(e) {
        e.preventDefault();
        const newUser = {
            id: Date.now(),
            date: new Date().toLocaleString('bn-BD'),
            name: document.getElementById('u-name').value,
            village: document.getElementById('u-village').value,
            mobile: document.getElementById('u-mobile').value,
            userId: document.getElementById('u-id').value,
            pass: document.getElementById('u-pass').value,
            role: document.getElementById('u-role').value
        };
        usersList.push(newUser);
        calculateTotals();
        renderTableModule6();
        e.target.reset();
    }

    function renderTableModule6() {
        let rows = usersList.map((u, idx) => `
            <tr>
                <td>${u.date}</td>
                <td>${u.name}</td>
                <td>${u.village}</td>
                <td>${u.mobile}</td>
                <td>${u.userId}</td>
                <td>${u.pass}</td>
                <td>${u.role}</td>
                <td><button class="btn-delete" onclick="deleteUser(${idx})">মুছুন</button></td>
            </tr>
        `).join('');

        document.getElementById('table-container').innerHTML = `
            <h3>ইউজার তালিকা</h3>
            <table>
                <thead>
                    <tr>
                        <th>তারিখ/সময়</th><th>নাম</th><th>গ্রাম</th><th>মোবাইল</th><th>ইউজার আইডি</th><th>পাসওয়ার্ড</th><th>রোল</th><th>Action</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        `;
    }

    function deleteUser(idx) {
        if(usersList[idx].userId === 'admin') {
            alert("মূল এডমিন অ্যাকাউন্ট মোছা যাবে না!");
            return;
        }
        if(confirm("ইউজারটি মুছে ফেলতে চান?")) {
            usersList.splice(idx, 1);
            calculateTotals();
            renderTableModule6();
        }
    }

    // --- Calculation Engine ---
    function getCalculatedTotals() {
        let totCol = database.module1.reduce((acc, i) => acc + i.amount, 0);
        let totVilCol = database.module5.reduce((acc, i) => acc + i.amount, 0);
        let totExp = database.module3.reduce((acc, i) => acc + i.amount, 0);

        let depositSum = database.module2.filter(i => i.type === 'জমা').reduce((acc, i) => acc + i.amount, 0);
        let returnSum = database.module2.filter(i => i.type === 'ফেরত').reduce((acc, i) => acc + i.amount, 0);
        let netDeposit = depositSum - returnSum;

        let surplus = (totCol + totVilCol + netDeposit) - totExp;

        return { totCol, totVilCol, totExp, netDeposit, surplus };
    }

    function calculateTotals() {
        let totals = getCalculatedTotals();
        
        document.getElementById('dash-val-1').innerText = totals.totCol.toFixed(2);
        document.getElementById('dash-val-2').innerText = totals.netDeposit.toFixed(2);
        document.getElementById('dash-val-3').innerText = totals.totExp.toFixed(2);
        document.getElementById('dash-val-4').innerText = totals.surplus.toFixed(2);
        document.getElementById('dash-val-5').innerText = totals.totVilCol.toFixed(2);
        document.getElementById('dash-val-6').innerText = usersList.length;
    }
</script>
